# Terminal colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse
set -g mouse on
set -g allow-passthrough on

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Vim-style pane splitting
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Vim-tmux-navigator integration (Ctrl-h/j/k/l to navigate)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Reduce escape delay for Neovim
set -sg escape-time 10

# Focus events for Neovim
set -g focus-events on

# Pass through the kitty keyboard protocol / extended keys (e.g. Shift+Enter in
# Claude Code) instead of stripping them. Needed on ANY host where Claude Code
# runs inside tmux -- local or over SSH.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ============================================================================
# Per-host theme — colour the status bar (and active pane border) by hostname
# so it's instantly obvious which machine a session lives on. Shared config;
# each host self-selects via `hostname -s`. Adjust the names to match your
# `hostname -s` output if you add/rename hosts.
# ============================================================================
# Default (this Mac + anything unmatched): teal
set -g status-style 'bg=colour30,fg=white'
set -g pane-active-border-style 'fg=colour30'
set -g pane-border-style 'fg=colour238'

# Balder (CachyOS gaming rig): orange
if-shell '[ "$(hostname -s)" = balder-cachos ]' \
  "set -g status-style 'bg=colour208,fg=black' ; set -g pane-active-border-style 'fg=colour208'"

# Debian dev VM: green
if-shell '[ "$(hostname -s)" = dev ]' \
  "set -g status-style 'bg=colour28,fg=white' ; set -g pane-active-border-style 'fg=colour28'"

# Backup VM: purple
if-shell '[ "$(hostname -s)" = backup ]' \
  "set -g status-style 'bg=colour91,fg=white' ; set -g pane-active-border-style 'fg=colour91'"

# Status bar content: session · HOST on the left, date/time on the right.
set -g status-left-length 40
set -g status-left ' #[bold]#S#[nobold] · #h '
set -g status-right ' #[bold]%a %d %b#[nobold]  %H:%M '
set -g window-status-current-style 'reverse,bold'

# Optional per-machine tweaks (gitignored), mirroring the ~/.zshrc.local pattern.
if-shell '[ -f ~/.tmux.local.conf ]' 'source-file ~/.tmux.local.conf'

# --- Plugins (TPM): session save/restore across reboots ---------------------
# One-time per machine after pulling: git clone the TPM repo, then run
#   ~/.tmux/plugins/tpm/bin/install_plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Pane-content capture OFF: replaying saved pane text on restore causes garbled
# repaints (stacked status bars / P10k fill) over SSH. Layout/sessions still
# restore; just not the noisy content replay.
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Keep this as the LAST line of the file.
run '~/.tmux/plugins/tpm/tpm'
# ----------------------------------------------------------------------------
